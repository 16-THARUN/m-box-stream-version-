name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # Every push to main and every pull request: debug APK
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: m-box-stream-debug
          path: app/build/outputs/apk/debug/*.apk

      # A tag like v1.0.0: signed release APK as a draft GitHub Release
      - name: Build signed release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          MBOX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MBOX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MBOX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export MBOX_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Draft GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: app/build/outputs/apk/release/*.apk
