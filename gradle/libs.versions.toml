[versions]
agp = "9.4.1"
kotlin = "2.3.21"
serialization = "1.7.3"
ksp = "2.3.2"
hilt = "2.59.2"
media3 = "1.4.1"
room = "2.8.4"
composeBom = "2026.02.01"
glide = "4.16.0"
datastore = "1.1.1"
jaudiotagger = "3.0.1"
coroutines = "1.9.0"
lifecycle = "2.8.7"
retrofit = "2.11.0"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"

[libraries]
# Media3
media3-exoplayer      = { group = "androidx.media3", name = "media3-exoplayer",  version.ref = "media3" }
media3-session        = { group = "androidx.media3", name = "media3-session",    version.ref = "media3" }
media3-ui             = { group = "androidx.media3", name = "media3-ui",         version.ref = "media3" }
media3-dash           = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
ffmpeg-kit-audio      = { group = "dev.ffmpegkit-maintained", name = "ffmpeg-kit-audio", version = "8.1.7" }

# Room
room-runtime         = { group = "androidx.room",   name = "room-runtime",      version.ref = "room" }
room-ktx             = { group = "androidx.room",   name = "room-ktx",          version.ref = "room" }
room-compiler        = { group = "androidx.room",   name = "room-compiler",     version.ref = "room" }

# Hilt
hilt-android         = { group = "com.google.dagger", name = "hilt-android",          version.ref = "hilt" }
hilt-compiler        = { group = "com.google.dagger", name = "hilt-android-compiler",  version.ref = "hilt" }
hilt-navigation      = { group = "androidx.hilt",     name = "hilt-navigation-compose", version = "1.2.0" }

# Compose (Player style aliases)
compose-bom          = { group = "androidx.compose",  name = "compose-bom",            version.ref = "composeBom" }
compose-ui           = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling   = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-preview      = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3    = { group = "androidx.compose.material3", name = "material3" }
compose-icons-ext    = { group = "androidx.compose.material", name = "material-icons-extended" }
activity-compose     = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose (Stream style aliases)
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# DataStore
datastore-prefs      = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Glide
glide                = { group = "com.github.bumptech.glide", name = "glide",         version.ref = "glide" }
glide-compose        = { group = "com.github.bumptech.glide", name = "compose",       version = "1.0.0-beta01" }

# JAudioTagger
jaudiotagger         = { group = "com.github.Adonai", name = "jaudiotagger", version = "2.3.15" }

# Coroutines & Core
coroutines-android   = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
core-ktx             = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-palette     = { group = "androidx.palette", name = "palette", version = "1.0.0" }

# Retrofit
retrofit             = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-gson        = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }

# Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

[plugins]
android-application  = { id = "com.android.application", version.ref = "agp" }
android-library      = { id = "com.android.library", version.ref = "agp" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                 = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                  = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
